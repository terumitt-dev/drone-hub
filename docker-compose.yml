version: "3"

services:
  drone-server:
    image: drone/drone:2
    container_name: drone-server
    expose:
      - "80"
    volumes:
      - ./data:/data
    restart: always
    environment:
      # --- 基本設定 ---
      # cloudflared が外部からの HTTPS を終端し、内部 HTTP で drone-server に接続する。
      # DRONE_SERVER_HOST / PROTO は外部公開 URL に合わせる（GitHub OAuth callback と一致させるため）。
      - DRONE_SERVER_HOST=${DRONE_SERVER_HOST}
      - DRONE_SERVER_PROTO=${DRONE_SERVER_PROTO}
      - DRONE_SERVER_PORT=:80

      # --- GitHub OAuth ---
      - DRONE_GITHUB_CLIENT_ID=${DRONE_GITHUB_CLIENT_ID}
      - DRONE_GITHUB_CLIENT_SECRET=${DRONE_GITHUB_CLIENT_SECRET}

      # --- 認証関連 ---
      - DRONE_RPC_SECRET=${DRONE_RPC_SECRET}
      - DRONE_USER_CREATE=username:${DRONE_ADMIN},admin:true
      - DRONE_USER_FILTER=${DRONE_ADMIN}
      - DRONE_OPEN=false

      # --- ログ設定 ---
      - DRONE_LOGS_DEBUG=false
      - DRONE_LOGS_TRACE=false

  drone-runner:
    image: drone/drone-runner-docker:1
    container_name: drone-runner
    restart: always
    depends_on:
      - drone-server
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # Runner は Docker network 内で drone-server に直接接続する
      - DRONE_RPC_PROTO=http
      - DRONE_RPC_HOST=drone-server
      - DRONE_RPC_SECRET=${DRONE_RPC_SECRET}
      - DRONE_RUNNER_CAPACITY=2
      - DRONE_RUNNER_NAME=default-runner

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: drone-cloudflared
    restart: always
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - drone-server
